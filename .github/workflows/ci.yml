name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: bagyo
          POSTGRES_PASSWORD: bagyo
          POSTGRES_DB: bagyo_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U bagyo" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://bagyo:bagyo@localhost:5432/bagyo_test?schema=public
      REDIS_URL: redis://localhost:6379
      APP_SECRET: ci-secret-0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Audit production dependencies (fail on critical)
        run: |
          pnpm audit --prod --audit-level critical || {
            echo '::error::critical vulnerability found'; exit 1; }
          pnpm audit --prod || echo '::warning::non-critical vulnerabilities found (non-blocking)'
      - name: Build (includes prisma generate — required before typed lint)
        run: pnpm build
      - name: Lint
        run: pnpm lint && pnpm format:check
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests (parser coverage gate ≥90%)
        run: pnpm test:unit
      - name: Migrate test database
        run: pnpm db:migrate
      - name: Integration tests
        run: pnpm test:integration

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build --target api -t bagyo-api:ci .
      - name: Build worker image
        run: docker build --target worker -t bagyo-worker:ci .
